<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141233"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 10; }
      .boxok { stroke: #34d399; }
      .boxfail { stroke: #f87171; }
      .label { font-size: 15px; fill: #e2e8f0; font-weight: 600; }
      .sub { font-size: 11px; fill: #94a3b8; }
      .edge { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edgeloop { stroke: #fbbf24; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 4 4; }
      .tok { fill: #22d3ee; filter: drop-shadow(0 0 6px #22d3ee); }
      .glow { animation: glow 2.2s ease-in-out infinite; }
      @keyframes glow {
        0%, 100% { stroke-opacity: 0.5; }
        50% { stroke-opacity: 1; }
      }
    </style>
  </defs>
  <rect width="1100" height="420" fill="url(#pbg)"/>
  <text x="30" y="36" class="label" font-size="18">LangGraph Analysis Pipeline — one run per Research Question</text>

  <!-- nodes -->
  <g>
    <rect x="30"  y="160" width="150" height="60" class="box"/>
    <text x="105" y="185" class="label" text-anchor="middle">code_generator</text>
    <text x="105" y="203" class="sub" text-anchor="middle">writes analysis script</text>

    <rect x="260" y="160" width="150" height="60" class="box"/>
    <text x="335" y="185" class="label" text-anchor="middle">sandbox_execute</text>
    <text x="335" y="203" class="sub" text-anchor="middle">Docker, --network none</text>

    <rect x="260" y="300" width="150" height="60" class="box" stroke="#fbbf24"/>
    <text x="335" y="325" class="label" text-anchor="middle">code_corrector</text>
    <text x="335" y="343" class="sub" text-anchor="middle">fixes traceback, retries</text>

    <rect x="490" y="60"  width="150" height="60" class="box boxok"/>
    <text x="565" y="85" class="label" text-anchor="middle">result_analyzer</text>
    <text x="565" y="103" class="sub" text-anchor="middle">parses stdout</text>

    <rect x="490" y="300" width="150" height="60" class="box boxfail"/>
    <text x="565" y="325" class="label" text-anchor="middle">give_up</text>
    <text x="565" y="343" class="sub" text-anchor="middle">attempts exhausted</text>

    <rect x="720" y="60" width="150" height="60" class="box boxok"/>
    <text x="795" y="85" class="label" text-anchor="middle">insight_writer</text>
    <text x="795" y="103" class="sub" text-anchor="middle">grounded summary</text>

    <rect x="920" y="60" width="150" height="60" class="box boxok"/>
    <text x="995" y="85" class="label" text-anchor="middle">visualization_builder</text>
    <text x="995" y="103" class="sub" text-anchor="middle">chart selection</text>

    <rect x="920" y="300" width="150" height="60" class="box" stroke="#64748b"/>
    <text x="995" y="325" class="label" text-anchor="middle">END</text>
    <text x="995" y="343" class="sub" text-anchor="middle">state persisted</text>
  </g>

  <!-- edges -->
  <path class="edge" d="M180,190 H260"/>
  <path class="edge" d="M335,160 V135 H565 V120"/> <!-- sandbox success -> result_analyzer -->
  <path class="edgeloop glow" d="M335,220 V300"/>  <!-- sandbox fail w/ attempts left -> corrector -->
  <path class="edgeloop glow" d="M260,330 H180 V190 H260"/> <!-- corrector -> back to sandbox -->
  <path class="edge" d="M335,220 V265 H565 V300"/> <!-- sandbox fail exhausted -> give_up -->
  <path class="edge" d="M640,90 H720"/>
  <path class="edge" d="M870,90 H920"/>
  <path class="edge" d="M995,120 V300"/>
  <path class="edge" d="M640,330 H920"/>

  <!-- traveling execution token along the happy path -->
  <circle r="6" class="tok">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M105,190 H260 H335 V135 H565 V90 H720 H795 H870 H920 H995 V300" />
  </circle>

  <text x="30" y="400" class="sub">dashed amber = self-correction retry loop (up to max_attempts) · glowing dot = one successful trial traversal</text>
</svg>
