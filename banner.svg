<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .node { fill: #0f172a; stroke: url(#glow); stroke-width: 2; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 2.4s ease-in-out infinite 0.6s; transform-origin: center; }
      .pulse3 { animation: pulse 2.4s ease-in-out infinite 1.2s; transform-origin: center; }
      .pulse4 { animation: pulse 2.4s ease-in-out infinite 1.8s; transform-origin: center; }
      @keyframes pulse {
        0%   { r: 5; opacity: .9; }
        50%  { r: 9; opacity: .25; }
        100% { r: 5; opacity: .9; }
      }
      .dot { fill: #22d3ee; }
      .dotpath { animation: travel 4.5s linear infinite; }
      .dotpath2 { animation: travel 4.5s linear infinite 1.1s; }
      .dotpath3 { animation: travel 4.5s linear infinite 2.2s; }
      @keyframes travel {
        0%   { offset-distance: 0%; opacity: 0; }
        5%   { opacity: 1; }
        95%  { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 54px; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 19px; fill: #94a3b8; }
      .float { animation: floaty 4s ease-in-out infinite; }
      @keyframes floaty {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>
  <circle cx="150" cy="40" r="160" fill="#4f46e5" filter="url(#blur1)" opacity="0.25"/>
  <circle cx="1080" cy="190" r="160" fill="#0891b2" filter="url(#blur1)" opacity="0.25"/>

  <!-- flowing connector path (decorative pipeline motif) -->
  <path id="flow" d="M 60,150 C 260,60 340,220 560,140 S 900,40 1140,120" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>
  <circle r="4" class="dot dotpath"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  <circle r="4" class="dot dotpath2"><animateMotion dur="4.5s" begin="1.1s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
  <circle r="4" class="dot dotpath3"><animateMotion dur="4.5s" begin="2.2s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>

  <g class="float">
    <circle cx="90" cy="150" r="5" class="pulse" fill="#22d3ee"/>
    <circle cx="330" cy="182" r="5" class="pulse2" fill="#818cf8"/>
    <circle cx="620" cy="128" r="5" class="pulse3" fill="#a78bfa"/>
    <circle cx="900" cy="70" r="5" class="pulse4" fill="#f472b6"/>
    <circle cx="1140" cy="118" r="5" class="pulse" fill="#22d3ee"/>
  </g>

  <text x="60" y="105" class="title">DataMind</text>
  <text x="60" y="140" class="subtitle">Autonomous, self-correcting, RAG-augmented EDA — from raw CSV to written insight, unattended.</text>
</svg>
