# OPTIONAL — not used by default.
# DataMind runs on SQLite (aiosqlite). No database server is needed.
# This file is kept for reference only, in case a future migration to
# PostgreSQL is desired. Do NOT run this as part of the normal setup.
services:
  postgres:
    image: postgres:16
    container_name: datamind-postgres
    environment:
      POSTGRES_USER: datamind
      POSTGRES_PASSWORD: datamind_local_dev
      POSTGRES_DB: datamind
    ports:
      - "5432:5432"
    volumes:
      - datamind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datamind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  datamind_postgres_data: