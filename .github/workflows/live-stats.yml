name: live-stats

on:
  push:
    branches: [main, master]
    # ignore the auto-stats commit itself to prevent loops
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}        # owner/repo
      GH_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch full history so we can walk commits
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Generate live stats
        run: python scripts/live_stats.py
        continue-on-error: true

      - name: Commit stats update
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || \
            git commit -m "chore: update live stats $(date -u +%F) [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      # ── Optional: ping the profile repo for a 3rd contribution square ──
      - name: Notify profile repo
        if: secrets.PROFILE_TOKEN != ''
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PROFILE_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Sp2736/Sp2736/dispatches \
            -d "{\"event_type\":\"project-deployed\",\"client_payload\":{\"repo\":\"${{ github.repository }}\"}}"
        continue-on-error: true
